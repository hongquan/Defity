name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-latest
            target: x86
          - runner: ubuntu-latest
            target: aarch64
          - runner: ubuntu-latest
            target: armv7
          - runner: ubuntu-latest
            target: s390x
          - runner: ubuntu-latest
            target: ppc64le
        python:
          - version: '3.10'
            features: ''
          - version: '3.10'
            features: 'abi3'
          - version: '3.11'
            features: ''
          - version: '3.12'
            features: ''
          - version: '3.13'
            features: ''
          - version: '3.14'
            features: ''
          - version: '3.14t'
            features: ''
          - version: '3.15'
            features: 'abi3t'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python.version }}
          allow-prereleases: ${{ matrix.python.version == '3.15' }}
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Build wheels
        uses: PyO3/maturin-action@v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i ${{ matrix.python.version }} --features=${{ matrix.python.features }}
          sccache: 'true'
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wheels-py-${{ matrix.python.features || matrix.python.version }}-linux-${{ matrix.platform.target }}
          path: dist

  musl-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - i686-unknown-linux-musl
        python:
          - version: '3.12'
            features: ''
          - version: '3.12'
            features: 'abi3'
          - version: '3.13'
            features: ''
          - version: '3.14'
            features: ''
          - version: '3.14t'
            features: ''
          - version: '3.15'
            features: 'abi3t'
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-python@v7.0.0
      with:
        python-version: ${{ matrix.python.version }}
        allow-prereleases: ${{ matrix.python.version == '3.15' }}
        architecture: x64
    - name: Build wheels
      uses: PyO3/maturin-action@v1.51.0
      with:
        target: ${{ matrix.target }}
        manylinux: musllinux_1_2
        args: --release --out dist -i ${{ matrix.python.version }} --features=${{ matrix.python.features }}
    - name: Install built wheel
      if: matrix.target == 'x86_64-unknown-linux-musl' && matrix.python.version == '3.14'
      uses: vjik/docker-run@v1
      with:
        image: alpine:3.24
        volumes: ${{ github.workspace }}:/io
        workdir: /io
        command: |
          apk add py3-pip shared-mime-info build-base python3-dev
          pip3 install -U --break-system-packages pip pytest-mypy
          pip3 install --break-system-packages defity --no-index --find-links /io/dist/ --force-reinstall
          rm -rf defity/
          python3 -m pytest
    - name: Upload wheels
      uses: actions/upload-artifact@v7.0.1
      with:
        name: wheels-py-${{ matrix.python.features || matrix.python.version }}-musllinux-${{ matrix.target }}
        path: dist

  musl-linux-cross:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - target: aarch64-unknown-linux-musl
            arch: aarch64
          - target: armv7-unknown-linux-musleabihf
            arch: armv7
        python:
          - version: '3.10'
            features: ''
          - version: '3.10'
            features: 'abi3'
          - version: '3.11'
            features: ''
          - version: '3.12'
            features: ''
          - version: '3.13'
            features: ''
          - version: '3.14'
            features: ''
          - version: '3.14t'
            features: ''
          - version: '3.15'
            features: 'abi3t'
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-python@v7.0.0
      with:
        python-version: ${{ matrix.python.version }}
        allow-prereleases: ${{ matrix.python.version == '3.15' }}
    - name: Build wheels
      uses: PyO3/maturin-action@v1.51.0
      with:
        target: ${{ matrix.platform.target }}
        manylinux: musllinux_1_2
        args: --release --out dist -i ${{ matrix.python.version }} --features=${{ matrix.python.features }}
    - uses: uraimo/run-on-arch-action@v3.2.0
      name: Install built wheel
      if: matrix.python.version == '3.14'
      with:
        arch: ${{ matrix.platform.arch }}
        distro: alpine_latest
        githubToken: ${{ github.token }}
        dockerRunArgs: -v ${{ github.workspace }}:/io -w /io
        install: |
          apk add py3-pip shared-mime-info build-base python3-dev
          pip3 install -U --break-system-packages pip pytest-mypy
        run: |
          pip3 install --break-system-packages defity --no-index --find-links /io/dist/ --force-reinstall
          rm -rf defity/
          python3 -m pytest
    - name: Upload wheels
      uses: actions/upload-artifact@v7.0.1
      with:
        name: wheels-py-${{ matrix.python.features || matrix.python.version }}-musllinux-${{ matrix.platform.target }}
        path: dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
          - runner: windows-latest
            target: x86
        python:
          - version: '3.10'
            features: ''
          - version: '3.10'
            features: 'abi3'
          - version: '3.11'
            features: ''
          - version: '3.12'
            features: ''
          - version: '3.13'
            features: ''
          - version: '3.14'
            features: ''
          - version: '3.14t'
            features: ''
          - version: '3.15'
            features: 'abi3t'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python.version }}
          architecture: ${{ matrix.platform.target }}
          allow-prereleases: ${{ matrix.python.version == '3.15' }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i ${{ matrix.python.version }} --features=${{ matrix.python.features }}
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wheels-py-${{ matrix.python.features || matrix.python.version }}-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-latest
            target: x86_64
          - runner: macos-14
            target: aarch64
        python:
          - version: '3.10'
            features: ''
          - version: '3.10'
            features: 'abi3'
          - version: '3.11'
            features: ''
          - version: '3.12'
            features: ''
          - version: '3.13'
            features: ''
          - version: '3.14'
            features: ''
          - version: '3.14t'
            features: ''
          - version: '3.15'
            features: 'abi3t'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python.version }}
          allow-prereleases: ${{ matrix.python.version == '3.15' }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i ${{ matrix.python.version }} --features=${{ matrix.python.features }}
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wheels-py-${{ matrix.python.features || matrix.python.version }}-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build sdist
        uses: PyO3/maturin-action@v1.51.0
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wheels-sdist
          path: dist

  test-linux:
    name: Test linux ${{ matrix.os.arch }} py${{ matrix.python-version }} wheel
    runs-on: ${{ matrix.os.label }}
    needs:
      - linux
    permissions:
      contents: read
    strategy:
      matrix:
        os:
          - label: ubuntu-26.04
            arch: x86_64
          - label: ubuntu-26.04-arm
            arch: aarch64
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.14t', '3.15', '3.15t']
    steps:
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - uses: actions/checkout@v7.0.1
        name: Download tests
        with:
          sparse-checkout: tests/
      - uses: actions/download-artifact@v8.0.1
        name: Download wheels
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Install wheel
        run: |
          python3 -m venv venv
          ./venv/bin/pip install defity --no-index --find-links dist --force-reinstall
      - name: Test importing
        run: |
          ./venv/bin/python3 -c 'from defity import __version__;print(__version__)'
      - name: Run tests
        run: |
          ./venv/bin/pip install -U pytest-mypy
          ./venv/bin/python3 -m pytest

  release:
    name: Release
    runs-on: ubuntu-latest
    if: "startsWith(github.ref, 'refs/tags/')"
    needs: [test-linux, linux, musl-linux, musl-linux-cross, windows, macos, sdist]
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
