[project]
name = "defity"
description = "Speedy library to detect file type from initial part of file content"
readme = "README.rst"
requires-python = ">=3.10"
authors = [
  { name = "Nguyễn Hồng Quân", email = "ng.hong.quan@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python",
  "Programming Language :: Rust",
]
dependencies = []
dynamic = ["version"]

[dependency-groups]
dev = [
  "maturin >= 1.14.1",
  "pytest-mypy >= 1.0.1",
  "ruff >= 0.16.3",
]
docs = [
  "sphinx >= 9.1.0; python_version >= '3.12'",
]

[build-system]
requires = ["maturin >= 1.14.1,<2.0"]
build-backend = "maturin"

[tool.maturin]
include = [{ path = "Cargo.lock", format = "sdist" }]
strip = true

[tool.pytest.ini_options]
minversion = "8.0"
norecursedirs = "__pypackages__ _build"

[tool.ruff]
line-length = 120

target-version = "py312"

exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "venv",
  "*/static/CACHE/*",
]
